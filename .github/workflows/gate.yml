# 게이트 워크플로. **이 파일은 무엇을 돌릴지 정하지 않는다** — `scripts/gates.txt`의 `ci` 칸이
# 정하고, 이 파일은 그것을 부르는 자리일 뿐이다. 둘이 갈라서면 러너가 FAIL을 낸다.
#
# 게이트를 하나씩 부르지 않는다. 개별로 부르면 선행 관계가 무너져 산출물을 읽는 게이트가
# 각자 다시 빌드하거나 디스크에 남은 낡은 것을 잰다. 그래서 호출은 `bun run gate:ci` 하나이고,
# 러너가 순서와 회차별 산출물 디렉터리를 쥔다.
#
# 러너는 이 파일의 모양을 좁게 요구한다: 호출은 **정확히** `bun run gate:ci`여야 하고,
# `if:`·`continue-on-error:`·셸 연산자가 있으면 FAIL이다.
#
# 이 파일이 왜 이렇게 생겼는지 — 모양을 좁히는 이유, 브라우저를 프로비저닝하지 않아도 되는
# 근거, 런타임을 고정하는 근거 — 는 전부 `docs/agents/verification.md`의 "CI가 무엇을 돌고
# 무엇을 돌지 않는가"가 갖는다. 여기 옮겨 적으면 두 자리가 조용히 갈라선다.
name: gate

on:
  push:
    branches: [main]
  pull_request:

# 같은 브랜치에 밀린 커밋이 있으면 앞선 회차를 취소한다 — 낡은 회차의 판정은 아무도 읽지 않는다.
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # 로컬에서 실측한 값이다 (bun 1.3.11 · node v24.14.1). 왜 bun은 정확히, node는 major로
      # 묶는지는 `docs/agents/verification.md`가 적는다.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: bun install --frozen-lockfile
      - run: bun run gate:ci
